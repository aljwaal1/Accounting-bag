name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  apk:
    name: Android APK (release and debug fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap native Android files
        run: |
          flutter --version
          flutter create --project-name accounting_bag --org com.explapp --platforms android .
          rm -f test/widget_test.dart
          flutter pub get
      - name: Try release APK
        id: release
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee release-build.log
      - name: Try debug APK if release failed
        id: debug
        if: steps.release.outcome == 'failure'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee debug-build.log
      - name: Confirm APK output
        run: |
          ls -lh build/app/outputs/flutter-apk || true
          test -f build/app/outputs/flutter-apk/app-release.apk || test -f build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Accounting-Bag-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Accounting-Bag-Build-Logs
          path: |
            release-build.log
            debug-build.log
          if-no-files-found: ignore
          retention-days: 14

  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
